name: CI/CD, CodeQL Analysis, and Deploy

on:
  push:
    branches: ["release-V1"]
  schedule:
    - cron: '0 0 1 * *' #'30 7 * * 0'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      # Autobuild attempts to build any compiled languages (C/C++, C#, Go, or Java).
      # If this step fails, then you should remove it and run the build manually (see below)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  build:
    name: Build App
    runs-on: ubuntu-latest
    needs: analyze
    if: github.ref == 'refs/heads/release-V1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14

      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Run tests
        run: npx jest
        working-directory: server/src/test

  deploy:
    name: Deploying App
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release-V1'

    steps:
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "srv-cj75kl5jeehc73cqfqhg"}' \
            https://api.render.com/v1/services/srv-cj75kl5jeehc73cqfqhg/deploys
